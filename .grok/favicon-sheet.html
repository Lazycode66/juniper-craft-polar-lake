<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #3a3d44; color: #e8eaee; font: 12px/1.4 sans-serif; }
      .row { display: flex; gap: 24px; padding: 16px; align-items: flex-end; }
      figure { margin: 0; text-align: center; }
      figcaption { margin-top: 6px; font-size: 11px; color: #c5ccd6; }
      .tile { image-rendering: pixelated; background: #fff; }
      .on-dark { background: #0b0c0e; }
    </style>
  </head>
  <body>
    <div class="row">
      <figure>
        <img class="tile" width="16" height="16" src="favicon.svg.tmp" />
        <figcaption>v1 16</figcaption>
      </figure>
      <figure>
        <img class="tile" width="16" height="16" src="favicon-v2.svg" />
        <figcaption>v2 16</figcaption>
      </figure>
      <figure>
        <img class="tile" width="16" height="16" src="favicon-v3.svg" />
        <figcaption>v3 16</figcaption>
      </figure>
      <figure>
        <img class="tile" width="16" height="16" src="/workspace/public/favicon.svg" />
        <figcaption>old 16</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure>
        <img class="tile" width="32" height="32" src="favicon.svg.tmp" />
        <figcaption>v1 32</figcaption>
      </figure>
      <figure>
        <img class="tile" width="32" height="32" src="favicon-v2.svg" />
        <figcaption>v2 32</figcaption>
      </figure>
      <figure>
        <img class="tile" width="32" height="32" src="favicon-v3.svg" />
        <figcaption>v3 32</figcaption>
      </figure>
      <figure>
        <img class="tile" width="32" height="32" src="/workspace/public/favicon.svg" />
        <figcaption>old 32</figcaption>
      </figure>
    </div>
  </body>
</html>
